<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f4f8;
            text-align: center;
            padding: 80px;
        }

        .container {
            background-color: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
        }

        input {
            padding: 12px;
            width: 70%;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather Checker</h1>

        <input type="text" id="city" placeholder="Enter a city">

        <br>

        <button id="checkWeather">Check Weather</button>

        <div id="result"></div>

    </div>

    <script src="script-7.js"></script>

</body>
</html>
